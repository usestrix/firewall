name: Build Firewall.pkg

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  pkg:
    runs-on: macos-26
    env:
      TEAM: ${{ vars.APPLE_TEAM }}
      NOTARY_PROFILE: firewall
      FIREWALL_POSTHOG_KEY: ${{ secrets.FIREWALL_POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - name: Install signing identities, profiles and notary key
        env:
          CERTIFICATES: ${{ secrets.MACOS_CERTIFICATES }}
          CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          APP_PROFILE: ${{ secrets.MACOS_APP_PROFILE }}
          EXTENSION_PROFILE: ${{ secrets.MACOS_EXTENSION_PROFILE }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          base64 --decode <<<"$CERTIFICATES" > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" -P "$CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain" >/dev/null

          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          base64 --decode <<<"$APP_PROFILE" > "$profiles/app.provisionprofile"
          base64 --decode <<<"$EXTENSION_PROFILE" > "$profiles/extension.provisionprofile"

          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
      - run: macos/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-macos-pkg
          path: macos/build/Firewall.pkg
